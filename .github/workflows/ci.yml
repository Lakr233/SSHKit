name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift Version
        run: swift --version

      - name: Run SwiftPM and Apple destination tests
        run: Script/test-destinations.sh

      - name: Check release packaging script syntax
        run: bash -n Script/package-release.sh
