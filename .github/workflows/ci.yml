name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftPM and Apple destination tests
        run: Script/test-destinations.sh

      - name: Check release packaging script syntax
        run: bash -n Script/package-release.sh
